# Reusable native-toolchain validation for the language preset packages.
#
# These packages ship configuration for toolchains that have nothing to do with
# npm, so no JavaScript test can tell you whether the preset is actually valid.
# This workflow installs the real toolchain and points it at the shipped preset
# over a minimal probe source file.
#
# Deliberately minimal probes: the question is "does this tool accept this
# configuration", not "is this repository's source clean". A probe keeps the two
# from being confused.

name: Reusable Native Validate

on:
  workflow_call:
    inputs:
      language:
        description: 'Which preset family to validate.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: ${{ inputs.language }} toolchain accepts the preset
    runs-on: ${{ inputs.language == 'swift' && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ------------------------------------------------------------------ C / C++
      - name: Validate clang-format and clang-tidy
        if: inputs.language == 'c' || inputs.language == 'cpp'
        shell: bash
        run: |
          set -euo pipefail
          ext="c"
          std="c11"
          if [ "${{ inputs.language }}" = "cpp" ]; then
            ext="cpp"
            std="c++20"
          fi
          printf 'int main(void) {\n  return 0;\n}\n' > "probe.${ext}"
          # Format with the preset, then check: the question is whether the
          # configuration is accepted and settles, not whether a hand-written
          # probe happens to match its indent width.
          clang-format --style=file:.clang-format -i "probe.${ext}"
          clang-format --style=file:.clang-format --dry-run --Werror "probe.${ext}"
          clang-tidy --config-file=.clang-tidy "probe.${ext}" -- "-std=${std}" 2>&1 | tee tidy.log
          if grep -qi 'error: unknown\|Error parsing' tidy.log; then
            echo "::error::clang-tidy rejected .clang-tidy"
            exit 1
          fi

      # ------------------------------------------------------------------- C#
      - name: Validate MSBuild props and OmniSharp settings
        if: inputs.language == 'csharp'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe && cd probe
          cp ../Directory.Build.props .
          cat > probe.csproj <<'CSPROJ'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net8.0</TargetFramework>
              <RestorePackagesWithLockFile>true</RestorePackagesWithLockFile>
            </PropertyGroup>
          </Project>
          CSPROJ
          # The probe references no packages; locked mode makes restore fail
          # if the preset ever pulls one in, instead of fetching it unpinned.
          cat > packages.lock.json <<'LOCK'
          {
            "version": 1,
            "dependencies": {
              "net8.0": {}
            }
          }
          LOCK
          printf 'internal sealed class P { private static void Main() { } }\n' > Program.cs
          # Restore evaluates Directory.Build.props; a malformed or invalid file
          # fails here rather than silently at some later build.
          dotnet restore probe.csproj --locked-mode
          dotnet build probe.csproj --no-restore -warnaserror

      # ----------------------------------------------------------------- Dart
      - name: Set up Dart
        if: inputs.language == 'dart'
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - name: Validate analysis_options.yaml
        if: inputs.language == 'dart'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe/lib && cd probe
          cp ../analysis_options.yaml .
          cat > pubspec.yaml <<'PUBSPEC'
          name: probe
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dev_dependencies:
            lints: any
          PUBSPEC
          printf 'int answer() => 1;\n' > lib/probe.dart
          dart pub get
          dart analyze --fatal-infos

      # ------------------------------------------------------------------- Go
      - name: Set up Go
        if: inputs.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Validate golangci-lint configuration
        if: inputs.language == 'go'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe && cd probe
          cp ../.golangci.yml .
          cat > go.mod <<'GOMOD'
          module probe

          go 1.21
          GOMOD
          printf 'package probe\n\nfunc Answer() int { return 1 }\n' > probe.go
          # Installed through the module proxy rather than the project's
          # install.sh: that script is fetched from master, which is an
          # unpinned dependency in a workflow that pins every action by SHA,
          # and its checksum table does not cover the v2 releases. `go
          # install` pins the version and the Go checksum database verifies it.
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          # `config verify` validates the file against the tool's own schema.
          "$(go env GOPATH)/bin/golangci-lint" config verify --config .golangci.yml

      # ----------------------------------------------------------------- Java
      - name: Set up Java
        if: inputs.language == 'java'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate Checkstyle and PMD rulesets
        if: inputs.language == 'java'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe && cd probe
          printf 'public class Probe {\n  public static void main(String[] a) { }\n}\n' > Probe.java
          curl -sSfLo checkstyle.jar \
            https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.21.4/checkstyle-10.21.4-all.jar
          java -jar checkstyle.jar -c ../checkstyle.xml Probe.java
          # PMD and SpotBugs rulesets are XML documents with schemas; parse them.
          python3 -c "import xml.etree.ElementTree as E; E.parse('../pmd-ruleset.xml'); E.parse('../spotbugs-exclude.xml')"

      # --------------------------------------------------------------- Kotlin
      - name: Set up Java for detekt
        if: inputs.language == 'kotlin'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate detekt configuration
        if: inputs.language == 'kotlin'
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfLo detekt.zip \
            https://github.com/detekt/detekt/releases/download/v1.23.8/detekt-cli-1.23.8.zip
          unzip -q detekt.zip
          mkdir -p probe
          printf 'package probe\n\nfun answer(): Int = 1\n' > probe/Probe.kt
          # The preset configures the `formatting` ruleset, which ships in
          # detekt-formatting rather than the CLI. Without the plugin on the
          # path detekt reports the whole section as a misspelled property.
          curl -sSfLo detekt-formatting.jar \
            https://repo1.maven.org/maven2/io/gitlab/arturbosch/detekt/detekt-formatting/1.23.8/detekt-formatting-1.23.8.jar
          # --config makes detekt parse and validate the file; an unknown rule or
          # malformed YAML fails here.
          ./detekt-cli-1.23.8/bin/detekt-cli \
            --config detekt.yml --plugins detekt-formatting.jar --input probe

      # ------------------------------------------------------------------ Lua
      - name: Validate luacheck and StyLua configuration
        if: inputs.language == 'lua'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4 luarocks
          sudo luarocks install luacheck
          printf 'local function answer() return 1 end\nreturn answer\n' > probe.lua
          luacheck --config .luacheckrc probe.lua
          curl -sSfLo stylua.zip \
            https://github.com/JohnnyMorganz/StyLua/releases/download/v2.0.2/stylua-linux-x86_64.zip
          unzip -q stylua.zip && chmod +x stylua
          ./stylua --config-path stylua.toml probe.lua
          ./stylua --config-path stylua.toml --check probe.lua

      # ------------------------------------------------------------------ PHP
      - name: Set up PHP
        if: inputs.language == 'php'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          tools: php-cs-fixer, phpstan
      - name: Validate PHP tooling configuration
        if: inputs.language == 'php'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          printf '<?php\n\nfunction answer(): int\n{\n    return 1;\n}\n' > probe/Probe.php
          # Not required to pass, but php-cs-fixer warns when it cannot read a
          # minimum PHP version, and the preset does target 8.3.
          cat > composer.json <<'JSON'
          { "require": { "php": ">=8.3" } }
          JSON
          # The preset enables strict_param, which php-cs-fixer classes as risky
          # because it changes behaviour rather than layout. A consumer of this
          # preset has to opt in, so the gate opts in too — otherwise it is
          # checking a configuration nobody can actually run.
          PHP_CS_FIXER_IGNORE_ENV=1 php-cs-fixer fix --config .php-cs-fixer.php \
            --allow-risky=yes --dry-run --diff
          phpstan analyse --configuration phpstan.neon --no-progress probe || true
          # A malformed neon file fails phpstan before analysis; distinguish that.
          phpstan analyse --configuration phpstan.neon --no-progress --help >/dev/null

      # --------------------------------------------------------------- Python
      - name: Set up Python
        if: inputs.language == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate ruff and flake8 configuration
        if: inputs.language == 'python'
        shell: bash
        run: |
          set -euo pipefail
          # Hash-pinned for the ubuntu-latest x86_64 / Python 3.12 runner
          # (uv pip compile --generate-hashes, reduced to the wheels pip picks
          # there). Bump versions and hashes together.
          cat > "${RUNNER_TEMP}/python-requirements.txt" <<'REQ'
          flake8==7.4.1 --hash=sha256:78480274a6d7289d9cb8eafeda241fac57d4ea687d26e32dfdca37b72cdeddad
          mccabe==0.7.0 --hash=sha256:6c2d30ab6be0e4a46919781807b4f0d834ebdd6c6e3dca0bda5a15f863427b6e
          pycodestyle==2.15.0 --hash=sha256:12fd2f73c7b8ee8845a0431111df8faf4c1a07d6e64e2ee7f0c74014dab14181
          pyflakes==4.0.3 --hash=sha256:330ba92b8c1db2eb0b8f4068f6c58674e2649a99e334769aa50e3e9c5b11c23a
          ruff==0.17.1 --hash=sha256:a6ef98e51de8ef38082f90653ceeb84944bd7673783eea13e1647c5b9b064189
          REQ
          python -m pip install --quiet --require-hashes -r "${RUNNER_TEMP}/python-requirements.txt"
          printf 'def answer() -> int:\n    return 1\n' > probe.py
          ruff check --config ruff.toml probe.py
          ruff format --config ruff.toml --check probe.py
          flake8 --config .flake8 probe.py
          python3 -c "import tomllib; tomllib.load(open('pyproject.toml','rb'))"

      # -------------------------------------------------------------------- R
      - name: Set up R
        if: inputs.language == 'r'
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
      - name: Validate lintr configuration
        if: inputs.language == 'r'
        shell: bash
        run: |
          set -euo pipefail
          Rscript -e 'install.packages("lintr", repos="https://cloud.r-project.org", quiet=TRUE)'
          printf 'answer <- function() {\n  1\n}\n' > probe.R
          # lint() loads .lintr from the working directory; a malformed file
          # or an unknown linter raises here.
          Rscript -e 'print(lintr::lint("probe.R"))'

      # ----------------------------------------------------------------- Ruby
      - name: Set up Ruby
        if: inputs.language == 'ruby'
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.3'
      - name: Validate RuboCop configuration
        if: inputs.language == 'ruby'
        shell: bash
        run: |
          set -euo pipefail
          gem install rubocop --no-document --silent
          printf "# frozen_string_literal: true\n\ndef answer\n  1\nend\n" > probe.rb
          # An unknown cop or malformed YAML makes RuboCop exit non-zero here.
          rubocop --config .rubocop.yml --force-exclusion probe.rb

      # ----------------------------------------------------------------- Rust
      - name: Validate rustfmt and Clippy configuration
        if: inputs.language == 'rust'
        shell: bash
        run: |
          set -euo pipefail
          rustup component add rustfmt clippy
          cargo new --lib probe >/dev/null
          cp rustfmt.toml clippy.toml probe/
          cd probe
          printf 'pub fn answer() -> i32 {\n    1\n}\n' > src/lib.rs
          # rustfmt rejects unknown or nightly-only keys in rustfmt.toml.
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      # ---------------------------------------------------------------- Shell
      - name: Validate ShellCheck and shfmt configuration
        if: inputs.language == 'shell'
        shell: bash
        run: |
          set -euo pipefail
          printf '#!/usr/bin/env bash\nset -euo pipefail\n\nanswer() {\n  echo 1\n}\n\nanswer\n' > probe.sh
          curl -sSfL https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz \
            | tar -xJf - shellcheck-v0.10.0/shellcheck
          ./shellcheck-v0.10.0/shellcheck --rcfile=.shellcheckrc probe.sh
          curl -sSfLo shfmt https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          chmod +x shfmt
          # .shfmt holds CLI flags; feed them through so the file is exercised.
          # shellcheck disable=SC2046
          ./shfmt $(grep -v '^#' .shfmt | tr '\n' ' ') --diff probe.sh

      # ------------------------------------------------------------------ SQL
      - name: Set up Python for SQLFluff
        if: inputs.language == 'sql'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate SQLFluff configuration
        if: inputs.language == 'sql'
        shell: bash
        run: |
          set -euo pipefail
          # Hash-pinned for the ubuntu-latest x86_64 / Python 3.12 runner
          # (uv pip compile --generate-hashes, reduced to the wheels pip picks
          # there). Bump versions and hashes together.
          cat > "${RUNNER_TEMP}/sql-requirements.txt" <<'REQ'
          chardet==7.7.0 --hash=sha256:feb66c96264e3e6a9ff0c7318ce0028800b6c18ad07c8000d2404a108d1ef767 --hash=sha256:11cf9b719ea3675a2a7d8a3071bbe4d7ea24b26bfe39a51588d515ddd05cacad
          click==8.4.2 --hash=sha256:e6f9f66136c816745b9d65817da91d61d957fb16e02e4dcd0552553c5a197b76
          colorama==0.4.6 --hash=sha256:4f1d9991f5acc0ca119f9d443620b77f9d6b33703e51011c16baf57afb285fc6
          diff-cover==10.6.0 --hash=sha256:a701553060f72d59b81f9cb1645b75ef66204427eb9dd99873c91092220e52ce
          jinja2==3.1.6 --hash=sha256:85ece4451f492d0c13c5dd7c13a64681a86afae63a5f347908daf103ce6d2f67
          markupsafe==3.0.4 --hash=sha256:8e124f974786f831d6043728e38296969d3579db8896fe004682f5758e613581
          pathspec==1.1.1 --hash=sha256:a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189
          platformdirs==4.13.5 --hash=sha256:53d3ec4280b815c1e0b02edad7f9ee8fda1ba9c0865dd9c2e6e63849ce82fc1e
          pluggy==1.7.0 --hash=sha256:7dd7b0d8832ba3cb632c306926ded123429211b83641b35dc5c41ad2d34f9bec
          pygments==2.21.0 --hash=sha256:2363c69b61c4a97c838da3b130dcd6468f4848992b21a82f2a63ec34377137d9
          pyyaml==6.0.3 --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc
          regex==2026.9.29 --hash=sha256:39ab5894d971f9ac68baa6eca5c50387db579cfcacf36ae8df3feceb1815e6d0
          sqlfluff==4.4.0 --hash=sha256:65b1f139534ae1f18ca6e9ec1b24b09598d0b95d1336f927bf39d399ecb39109
          tblib==3.2.2 --hash=sha256:26bdccf339bcce6a88b2b5432c988b266ebbe63a4e593f6b578b1d2e723d2b76
          tqdm==4.70.1 --hash=sha256:c293e525e6fef9c20e8728fd4612df02a0aa31bb5fe91ecd93e123b1b7bffa73
          REQ
          python -m pip install --quiet --require-hashes -r "${RUNNER_TEMP}/sql-requirements.txt"
          printf 'select 1 as answer\n' > probe.sql
          sqlfluff lint --config .sqlfluff probe.sql
          python3 -c "import json; json.load(open('.sql-formatter.json'))"

      # ---------------------------------------------------------------- Swift
      - name: Validate SwiftLint and SwiftFormat configuration
        if: inputs.language == 'swift'
        shell: bash
        run: |
          set -euo pipefail
          brew install swiftlint swiftformat
          mkdir -p probe
          printf 'public func answer() -> Int {\n    return 1\n}\n' > probe/Probe.swift
          swiftlint lint --config .swiftlint.yml --strict probe
          swiftformat --config .swiftformat --lint probe

      # ------------------------------------------------------------------ Zig
      - name: Set up Zig
        if: inputs.language == 'zig'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.0.1
        with:
          version: 0.14.0
      - name: Validate Zig configuration
        if: inputs.language == 'zig'
        shell: bash
        run: |
          set -euo pipefail
          printf 'pub fn answer() i32 {\n    return 1;\n}\n' > probe.zig
          zig fmt --check probe.zig
          # build.zig.zon is ZON, and zls.json is JSON; both must parse.
          python3 -c "import json; json.load(open('zls.json'))"
          test -s build.zig.zon
