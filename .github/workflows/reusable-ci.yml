# Reusable CI for every package in the @sebastienrousseau configuration family.
#
# One definition, called by all of them, so a gate added here applies everywhere
# on the next push instead of needing the same edit in dozens of repositories.

name: Reusable CI

on:
  workflow_call:
    inputs:
      node-versions:
        description: 'JSON array of Node versions to test. The first entry must be the engines.node floor.'
        required: false
        default: '["20", "22", "24"]'
        type: string
      os:
        description: 'JSON array of runner images.'
        required: false
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
        type: string
      validate-command:
        description: 'Optional npm script that runs the real tool against this configuration.'
        required: false
        default: ''
        type: string
      eslint-config:
        description: >-
          Flat config to lint with. Defaults to the family package; the two
          repositories that *are* those packages pass their own local file, so
          they lint against what they are about to publish rather than the
          previous release.
        required: false
        default: '@sebastienrousseau/eslint-config'
        type: string
      prettier-config:
        description: 'Prettier config to check formatting against.'
        required: false
        default: '@sebastienrousseau/prettier-config'
        type: string
      markdownlint-config:
        description: 'Markdownlint preset to lint documentation against.'
        required: false
        default: '@sebastienrousseau/markdownlint-config'
        type: string
      coverage-node:
        description: 'Node version the coverage gate runs on; the threshold flags postdate the supported floor.'
        required: false
        default: '24'
        type: string
      coverage-lines:
        description: 'Minimum line coverage. Measured at 100 across the family; 95 leaves room for one defensive branch without failing the build.'
        required: false
        default: 95
        type: number
      coverage-functions:
        description: 'Minimum function coverage. An uncovered export is an export nobody loads.'
        required: false
        default: 95
        type: number
      coverage-branches:
        description: 'Minimum branch coverage. Lower than the others because environment probing cannot be exercised from both sides on one runner.'
        required: false
        default: 80
        type: number
      lint-paths:
        description: 'Paths to lint and format-check.'
        required: false
        default: 'index.cjs index.mjs index.js examples benches fuzz tests'
        type: string

permissions:
  contents: read

jobs:
  conformance:
    name: Conformance (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        node: ${{ fromJSON(inputs.node-versions) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      # `npm ci` fails when package.json and package-lock.json disagree, which is
      # the gate that keeps the committed lockfile honest.
      - name: Install from the committed lockfile
        run: npm ci

      - name: Verify the declared Node floor matches this matrix
        shell: bash
        run: |
          set -euo pipefail
          floor="$(node -p "require('./package.json').engines.node.replace(/[^0-9.]/g, '').split('.')[0]")"
          echo "engines.node floor: ${floor}"
          first='${{ fromJSON(inputs.node-versions)[0] }}'
          if [ "${floor}" != "${first}" ]; then
            echo "::error::engines.node declares a floor of ${floor} but the matrix starts at ${first}." \
                 "The README advertises the floor, so CI must prove it."
            exit 1
          fi

      - name: Run the conformance suite
        run: npm test

  validate:
    name: Real tool accepts the configuration
    if: inputs.validate-command != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ fromJSON(inputs.node-versions)[0] }}

      - name: Install from the committed lockfile
        run: npm ci

      - name: Run the tool against this configuration
        run: npm run ${{ inputs.validate-command }}

  examples:
    name: Documented examples run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ fromJSON(inputs.node-versions)[0] }}

      - name: Install from the committed lockfile
        run: npm ci

      # Documentation that is never executed drifts. These are the snippets the
      # README points at.
      - name: Run every example
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for example in examples/*.js examples/*.mjs; do
            echo "==> ${example}"
            node "${example}"
            found=1
          done
          if [ "${found}" -eq 0 ]; then
            echo "::error::no examples found; the README documents this package as having runnable examples"
            exit 1
          fi

      - name: Smoke-run the benchmark
        run: npm run bench

      - name: Smoke-run the fuzz harness
        run: npm run fuzz

  quality:
    name: Lint and formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ fromJSON(inputs.node-versions)[0] }}

      # Installed without --save so the manifest and lockfile stay untouched;
      # these are CI tools, not dependencies of the published package.
      - name: Install the linters
        shell: bash
        env:
          ESLINT_CONFIG: ${{ inputs.eslint-config }}
          PRETTIER_CONFIG: ${{ inputs.prettier-config }}
        run: |
          set -euo pipefail
          packages=(eslint@10.10.0 prettier@3.6.2)
          # A local path means this repository *is* the config package, so it
          # lints against what it is about to publish rather than the last
          # release. Anything else is a package name and has to be fetched.
          [[ "${ESLINT_CONFIG}" == ./* ]] || packages+=("${ESLINT_CONFIG}")
          [[ "${PRETTIER_CONFIG}" == ./* ]] || packages+=("${PRETTIER_CONFIG}")
          npm install --no-save --no-audit --no-fund "${packages[@]}"

      - name: Resolve the configuration paths
        id: configs
        shell: bash
        env:
          ESLINT_CONFIG: ${{ inputs.eslint-config }}
          PRETTIER_CONFIG: ${{ inputs.prettier-config }}
        run: |
          set -euo pipefail
          resolve() {
            if [[ "$1" == ./* ]]; then
              printf '%s' "$1"
            else
              node -p "require.resolve('$1')"
            fi
          }
          echo "eslint=$(resolve "${ESLINT_CONFIG}")" >> "${GITHUB_OUTPUT}"
          echo "prettier=$(resolve "${PRETTIER_CONFIG}")" >> "${GITHUB_OUTPUT}"

      # Zero warnings, not just zero errors: a warning nobody fails on is a
      # warning nobody reads.
      - name: Lint at zero warnings
        run: >-
          npx eslint --no-config-lookup
          --config "${{ steps.configs.outputs.eslint }}"
          --max-warnings 0
          ${{ inputs.lint-paths }}

      - name: Check formatting
        run: >-
          npx prettier --config "${{ steps.configs.outputs.prettier }}"
          --check ${{ inputs.lint-paths }}

  docs:
    name: Documentation lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # An install snippet that names a version nobody checks is how a README
      # starts lying. Snippets are unversioned today; this keeps it that way,
      # or makes a versioned one agree with the manifest. Written in node
      # rather than shell: the pattern needs quotes and backticks, and those
      # do not survive being nested through YAML into bash.
      - name: Documented versions match the manifest
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const pkg = require(process.cwd() + "/package.json");
            const readme = fs.readFileSync("README.md", "utf8");
            const escaped = pkg.name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const re = new RegExp(escaped + "@([0-9][^\\s\"\x27`)\\]]*)", "g");
            const bad = [];
            for (const m of readme.matchAll(re)) {
              if (m[1] !== pkg.version) bad.push(m[1]);
            }
            for (const v of bad) {
              console.log("::error::README installs " + pkg.name + "@" + v +
                          " but the manifest says " + pkg.version);
            }
            if (bad.length) process.exit(1);
            console.log("documented versions agree with " + pkg.name + "@" + pkg.version);
          '

      - name: Check spelling
        uses: codespell-project/actions-codespell@e3258cca84ce02b0bb36a3d41f2c18f719a0cc1a # v2.4.3
        with:
          # errorprone is PMD's own category name (category/java/errorprone.xml);
          # spelling it "error-prone" would point the ruleset at nothing.
          ignore_words_list: crate,ser,strat,afterAll,doubleClick,errorprone
          skip: ./node_modules,./package-lock.json,./KEYS.asc,./web,./public

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ fromJSON(inputs.node-versions)[0] }}

      # Without --config, markdownlint-cli2 enforces its own defaults, which
      # are not the policy this family adopted: 80-column prose and no inline
      # HTML, neither of which anything else in the toolchain maintains. The
      # preset ships as a CommonJS module, and the tool only accepts a
      # configuration file whose name it recognises, so the module is loaded
      # and written back out as .markdownlint.json.
      - name: Lint Markdown
        shell: bash
        env:
          MARKDOWNLINT_CONFIG: ${{ inputs.markdownlint-config }}
        run: |
          set -euo pipefail
          # A local path means this repository *is* the preset, so it lints
          # against what it is about to publish rather than the last release.
          [[ "${MARKDOWNLINT_CONFIG}" == ./* ]] ||
            npm install --no-save --no-audit --no-fund "${MARKDOWNLINT_CONFIG}"
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const spec = process.env.MARKDOWNLINT_CONFIG;
            const preset = require(spec.startsWith("./") ? path.resolve(spec) : spec);
            fs.writeFileSync(
              path.join(process.env.RUNNER_TEMP, ".markdownlint.json"),
              JSON.stringify(preset, null, 2),
            );
          '
          npx --yes markdownlint-cli2@0.19.0 \
            --config "${RUNNER_TEMP}/.markdownlint.json" \
            "**/*.md" "#node_modules" "#web" "#public" "#CHANGELOG.md"

      # A documentation set nobody can navigate is not documentation. Offline
      # first so a flaky remote cannot fail the build on a link that is fine;
      # remote links are checked too, but 429 and 503 are not our bug.
      - name: Check documentation links
        uses: lycheeverse/lychee-action@a8c4c7cb88f0c7386610c35eb25108e448569cb0 # v2.7.0
        with:
          args: >-
            --no-progress --include-fragments
            --accept 200,204,206,429,503
            --exclude-path node_modules --exclude-path web --exclude-path public
            --exclude '^https://registry\.npmjs\.org'
            --exclude '^https://www\.npmjs\.com'
            './**/*.md'
          fail: true
          jobSummary: false

  # ---------------------------------------------------------------- Makefile
  makefile:
    name: The Makefile still works
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ fromJSON(inputs.node-versions)[0] }}

      - name: Install from the committed lockfile
        run: npm ci

      # The Makefile is the entry point a contributor reaches for first, and
      # nothing was exercising it: its targets could rot while the npm scripts
      # underneath stayed green. `make all` is test + lint.
      - name: make all
        run: make all

  # ---------------------------------------------------------------- Coverage
  coverage:
    name: Coverage threshold
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The coverage threshold flags postdate the Node floor these packages
      # support, so coverage runs on the newest Node in the matrix rather than
      # the oldest. The floor is still tested — by the conformance matrix.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.coverage-node }}

      - name: Install from the committed lockfile
        run: npm ci

      # Why these numbers: a configuration package is a data object plus a
      # handful of entry points, so line and function coverage should be near
      # total and anything less means an export nobody loads. Branches are
      # lower because the only branching is environment probing, which cannot
      # be exercised from both sides on one runner.
      # Note the glob rather than `tests/`: passing the directory makes
      # node --test error and instrument nothing, and the report then shows
      # 100% of zero files — a gate that always passes.
      - name: Enforce the coverage threshold
        shell: bash
        run: >-
          node --test
          --experimental-test-coverage
          --test-coverage-exclude="tests/**"
          --test-coverage-exclude="benches/**"
          --test-coverage-exclude="fuzz/**"
          --test-coverage-exclude="examples/**"
          --test-coverage-exclude="scripts/**"
          --test-coverage-lines=${{ inputs.coverage-lines }}
          --test-coverage-functions=${{ inputs.coverage-functions }}
          --test-coverage-branches=${{ inputs.coverage-branches }}
          tests/*.test.js

  # ----------------------------------------------------------- API breakage
  api:
    name: No API breakage since the last release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ fromJSON(inputs.node-versions)[0] }}

      # For a configuration package the public API is the shape of the object
      # it exports: removing or retyping a key breaks a consumer just as surely
      # as deleting a function. Compare against what is actually on the
      # registry, and fail on removals and type changes. Additions are fine.
      - name: Compare the exported shape against the published release
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          if ! npm view "${name}" version >/dev/null 2>&1; then
            echo "${name} has no published release yet; nothing to compare"
            exit 0
          fi
          published="$(npm view "${name}" version)"
          mkdir -p "${RUNNER_TEMP}/baseline" && cd "${RUNNER_TEMP}/baseline"
          npm pack "${name}@${published}" --silent >/dev/null
          tar xzf ./*.tgz
          cd "${GITHUB_WORKSPACE}"
          node -e '
            const path = require("node:path");
            const shape = (o, depth = 0) => {
              if (o === null || typeof o !== "object" || depth > 2) {
                return Array.isArray(o) ? "array" : typeof o;
              }
              if (Array.isArray(o)) return "array";
              return Object.fromEntries(
                Object.keys(o).sort().map((k) => [k, shape(o[k], depth + 1)]),
              );
            };
            const flat = (o, p = "", out = {}) => {
              for (const [k, v] of Object.entries(o)) {
                const key = p ? p + "." + k : k;
                if (v && typeof v === "object") flat(v, key, out);
                else out[key] = v;
              }
              return out;
            };
            const before = flat(shape(require(path.join(process.env.RUNNER_TEMP, "baseline", "package", "index.cjs"))));
            const after = flat(shape(require(path.join(process.cwd(), "index.cjs"))));
            const removed = Object.keys(before).filter((k) => !(k in after));
            const retyped = Object.keys(before).filter((k) => k in after && before[k] !== after[k]);
            for (const k of removed) console.log("::error::removed from the public shape: " + k);
            for (const k of retyped) console.log("::error::type changed: " + k + " was " + before[k] + ", now " + after[k]);
            const added = Object.keys(after).filter((k) => !(k in before)).length;
            if (removed.length || retyped.length) {
              console.log("breaking: " + removed.length + " removed, " + retyped.length + " retyped");
              process.exit(1);
            }
            console.log("compatible with " + process.env.PUBLISHED + ": " + added + " added, nothing removed or retyped");
          '
        env:
          PUBLISHED: ${{ github.sha }}

  # --------------------------------------------------------------- Packaging
  packaging:
    name: Distribution packages build and install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A packaging recipe that is never built is a recipe that has already
      # drifted. Both are built and then *installed*, and the installed tree is
      # loaded from node — the only proof that the paths in docs/packaging.md
      # are the paths the distribution actually resolves.
      #
      # Each runs in its own distribution's container rather than on the
      # runner. That is not fastidiousness: the package declares
      # nodejs (>= 20), and Ubuntu 24.04 ships Node 18, so the dependency is
      # unsatisfiable there and apt refuses the install. Debian stable has 20.
      - name: Build and install the Debian package
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          cp -r pkg/deb debian
          chmod +x debian/rules
          docker run --rm -v "${PWD}:/src" -w /src -e NAME="${name}" debian:stable-slim bash -euc '
            apt-get update -qq >/dev/null
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              build-essential debhelper dpkg-dev nodejs >/dev/null
            # dpkg-buildpackage refuses to start without build-essential even
            # though an architecture-independent package compiles nothing.
            dpkg-buildpackage -us -uc -b
            deb="$(find /  -maxdepth 2 -name "node-sebastienrousseau-*.deb" | head -1)"
            test -n "${deb}"
            apt-get install -y -qq "${deb}"
            scope="${NAME%%/*}"
            mkdir -p /tmp/consumer/node_modules/"${scope}"
            ln -s /usr/share/nodejs/"${NAME}" /tmp/consumer/node_modules/"${NAME}"
            cd /tmp/consumer
            node -e "
              const cfg = require(process.env.NAME);
              if (typeof cfg !== \"object\" || cfg === null) {
                throw new Error(\"installed package did not load as an object\");
              }
              console.log(\"deb require(): ok, \" + Object.keys(cfg).length + \" keys\");
            "
            # NODE_PATH is CommonJS-only — the ESM resolver ignores it — so the
            # symlink above is what makes this half of the check meaningful.
            node --input-type=module -e "
              const { default: cfg } = await import(process.env.NAME);
              if (typeof cfg !== \"object\" || cfg === null) {
                throw new Error(\"installed package did not import as an object\");
              }
              console.log(\"deb import: ok, \" + Object.keys(cfg).length + \" keys\");
            "
          '
          rm -rf debian

      - name: Build and install the RPM
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          bare="${name##*/}"
          scope="${name%%/*}"
          rpmname="nodejs-sebastienrousseau-${bare}"
          version="$(node -p "require('./package.json').version")"
          docker run --rm -v "${PWD}:/src:ro" -w /work fedora:41 bash -euc "
            dnf install -y -q rpm-build nodejs tar >/dev/null
            mkdir -p /work/SOURCES /work/SPECS
            cp -r /src /work/${rpmname}-${version}
            rm -rf /work/${rpmname}-${version}/node_modules /work/${rpmname}-${version}/.git
            tar czf /work/SOURCES/${rpmname}-${version}.tar.gz -C /work ${rpmname}-${version}
            cp /src/pkg/rpm/${rpmname}.spec /work/SPECS/
            rpmbuild --define '_topdir /work' -bb /work/SPECS/${rpmname}.spec
            rpm -i /work/RPMS/noarch/${rpmname}-${version}-1*.noarch.rpm
            mkdir -p /tmp/consumer/node_modules/${scope}
            ln -s /usr/lib/node_modules/${name} /tmp/consumer/node_modules/${name}
            cd /tmp/consumer
            node -e '
              const cfg = require(process.argv[1]);
              if (typeof cfg !== \"object\" || cfg === null) {
                throw new Error(\"installed package did not load as an object\");
              }
              console.log(\"rpm require(): ok, \" + Object.keys(cfg).length + \" keys\");
            ' ${name}
            node --input-type=module -e '
              const { default: cfg } = await import(process.argv[1]);
              if (typeof cfg !== \"object\" || cfg === null) {
                throw new Error(\"installed package did not import as an object\");
              }
              console.log(\"rpm import: ok, \" + Object.keys(cfg).length + \" keys\");
            ' ${name}
          "

      - name: Lint the AUR PKGBUILD
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq --no-install-recommends shellcheck
          # PKGBUILDs have no shebang and rely on makepkg-provided globals.
          shellcheck -s bash -e SC2034,SC2154,SC2148 pkg/aur/PKGBUILD

      # The standard allows a reproducible-builds claim only once it has been
      # verified. docs/packaging.md makes the claim, so this is the check that
      # entitles it to.
      - name: The tarball is reproducible
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/r1" "${RUNNER_TEMP}/r2"
          (cd "${RUNNER_TEMP}/r1" && npm pack "${GITHUB_WORKSPACE}" --silent >/dev/null)
          (cd "${RUNNER_TEMP}/r2" && npm pack "${GITHUB_WORKSPACE}" --silent >/dev/null)
          a="$(sha256sum "${RUNNER_TEMP}"/r1/*.tgz | cut -d" " -f1)"
          b="$(sha256sum "${RUNNER_TEMP}"/r2/*.tgz | cut -d" " -f1)"
          echo "pack 1: ${a}"
          echo "pack 2: ${b}"
          if [ "${a}" != "${b}" ]; then
            echo "::error::npm pack is not reproducible; docs/packaging.md claims it is"
            exit 1
          fi
          echo "byte-identical across two packs"
